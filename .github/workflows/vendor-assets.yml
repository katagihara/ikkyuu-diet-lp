name: Vendor CDN assets

# LP の画像は Manus の CloudFront にホットリンクされているだけで、リポジトリには入っていない。
# このワークフローで一度だけ画像を取得し、client/public/images/ としてリポジトリに同梱する。
on:
  push:
    branches:
      - claude/fix-lp-image-display-q7nat2
    paths:
      - 'scripts/vendor-assets.mjs'
      - '.github/workflows/vendor-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download CDN assets
        run: node scripts/vendor-assets.mjs

      - name: Commit vendored assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/public/images
          if git diff --cached --quiet; then
            echo "取り込む画像に変更はありません。"
            exit 0
          fi
          git commit -m "chore: CDN画像をclient/public/imagesに取り込み [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
